<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Twitch QR Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 28px;
    padding-bottom: 48px;
    pointer-events: none;
  }

  .wrap {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    opacity: 0;
    transform: translateY(80px) scale(.97);
    transition: opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .wrap.visible  { opacity: 1; transform: translateY(0) scale(1); }
  .wrap.leaving  { opacity: 0; transform: translateY(60px) scale(.97); transition-duration: .4s; }

  @keyframes swayL {
    0%,100% { transform: rotate(-0.5deg) translateY(0); }
    50%     { transform: rotate(0.5deg) translateY(-5px); }
  }
  @keyframes swayR {
    0%,100% { transform: rotate(0.5deg) translateY(-4px); }
    50%     { transform: rotate(-0.5deg) translateY(2px); }
  }
  .phone-frame.swaying { animation: swayL 6.5s ease-in-out infinite; }
  .qr-side.swaying    { animation: swayR 7.2s ease-in-out infinite; }

  /* =============================================
     ТЕЛЕГРАМ-КАРТОЧКА
     ============================================= */

  .phone-frame {
    width: 320px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 2px 8px rgba(0,0,0,.5),
      0 24px 60px rgba(0,0,0,.6);
    opacity: 0;
    transform: translateY(120px);
    transition: opacity .55s cubic-bezier(.16,.8,.2,1) .04s,
                transform .55s cubic-bezier(.16,.8,.2,1) .04s;
    /* Настоящая тёмная тема Telegram */
    background: #212121;
  }
  .wrap.visible .phone-frame { opacity: 1; transform: translateY(0); }

  /* ---------- ШАПКА ---------- */
  .tg-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 10px 8px;
    background: #212121;
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  .tg-back {
    display: flex;
    align-items: center;
    gap: 2px;
    color: #5288C1;
    font-size: 16px;
    font-weight: 400;
    flex-shrink: 0;
    line-height: 1;
  }
  .tg-back svg { width: 10px; height: 16px; }
  .tg-back-count {
    font-size: 16px;
    font-weight: 400;
    color: #5288C1;
  }
  .tg-header-center {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .tg-channel-name {
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
    text-align: center;
  }
  .tg-channel-sub {
    font-size: 12px;
    color: #8B8B8B;
    white-space: nowrap;
  }
  .tg-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #333;
    display: block;
  }

  /* ---------- ТЕЛО ---------- */
  .tg-body {
    background: #0E0E0E;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 520px;
  }

  .post-scroll {
    overflow-y: auto;
    overflow-x: hidden;
  }
  .post-scroll::-webkit-scrollbar { width: 0; }

  /* Закреплённое */
  .tg-pinned {
    display: none;
    align-items: center;
    gap: 10px;
    background: #1C1C1C;
    padding: 7px 12px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .tg-pinned.active { display: flex; }
  .tg-pinned-line {
    width: 2px;
    height: 28px;
    background: #5288C1;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .tg-pinned-texts { min-width: 0; }
  .tg-pinned-label {
    font-size: 11px;
    font-weight: 600;
    color: #5288C1;
    margin-bottom: 1px;
  }
  .tg-pinned-text {
    font-size: 11px;
    color: #8B8B8B;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Сообщение */
  .tg-message {
    margin: 6px 8px;
    background: #2B2B2B;
    border-radius: 12px;
    overflow: hidden;
  }

  /* Фото */
  .tg-photos {
    display: flex;
    gap: 2px;
  }
  .tg-photos:empty { display: none; }
  .tg-photos.single img {
    width: 100%;
    height: auto;
    max-height: 300px;
    object-fit: cover;
    display: block;
  }
  .tg-photos.multi img {
    width: 50%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  /* Текст + ссылка */
  .tg-text-wrap {
    padding: 8px 10px 6px;
  }
  .tg-link {
    display: none;
    font-size: 13px;
    color: #5288C1;
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 4px;
  }
  .tg-link.active { display: block; }
  .tg-text {
    font-size: 13.5px;
    line-height: 1.45;
    color: #FFFFFF;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tg-text:empty { display: none; }

  /* Время + просмотры — внутри пузырька, справа внизу */
  .tg-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    padding: 2px 10px 7px;
    color: #8B8B8B;
    font-size: 11px;
  }
  .tg-meta svg { opacity: .7; }

  /* ---------- РЕАКЦИИ ---------- */
  .tg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 8px 6px;
  }
  .tg-reactions:empty { display: none; padding: 0; }
  .tg-reaction {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(82,136,193,.18);
    border: 1px solid rgba(82,136,193,.25);
    border-radius: 999px;
    padding: 3px 9px 3px 6px;
    font-size: 12px;
    color: #FFFFFF;
    font-weight: 500;
  }
  .tg-reaction .em { font-size: 14px; line-height: 1; }

  /* ---------- НИЖНЯЯ ПАНЕЛЬ: комментарии ---------- */
  .tg-footer {
    background: #212121;
    border-top: 1px solid rgba(255,255,255,.06);
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .tg-footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tg-avatar-row {
    display: flex;
  }
  .tg-avatar-row span {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #212121;
    margin-left: -6px;
    display: block;
  }
  .tg-avatar-row span:first-child { margin-left: 0; }
  .tg-comment-label {
    font-size: 13px;
    font-weight: 500;
    color: #5288C1;
  }
  .tg-footer-right {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #8B8B8B;
    font-size: 12px;
  }
  .tg-footer-chevron {
    color: #8B8B8B;
    font-size: 16px;
    opacity: .6;
  }

  /* =============================================
     QR-КАРТОЧКА
     ============================================= */

  .qr-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(20px) scale(.94);
    transition: opacity .5s ease .12s, transform .5s cubic-bezier(.2,.85,.25,1.15) .12s;
  }
  .wrap.visible .qr-side { opacity: 1; transform: translateY(0) scale(1); }

  .qr-glow-wrap {
    position: relative;
    width: 330px; height: 330px;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-glow {
    position: absolute;
    inset: -8px;
    background: radial-gradient(circle at 50% 48%, #5288C1 0%, rgba(82,136,193,.35) 40%, transparent 72%);
    filter: blur(24px);
    opacity: .8;
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { opacity: .6; transform: scale(1); }
    50%     { opacity: .95; transform: scale(1.04); }
  }
  .qr-card {
    position: relative;
    z-index: 1;
    width: 314px; height: 314px;
    background: #FFFFFF;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.4);
    padding: 14px;
  }
  #qr-target { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #qr-target svg { display: block; width: 100% !important; height: 100% !important; }

  .qr-username-pill {
    padding: 10px 26px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .qr-username {
    font-size: 22px;
    font-weight: 700;
    color: #FFFFFF;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="wrap" id="wrap">

    <!-- ЛЕВАЯ КАРТОЧКА: Telegram-пост -->
    <div class="phone-frame" id="phone-frame">

      <!-- Шапка -->
      <div class="tg-topbar">
        <div class="tg-back">
          <svg viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 1L2 8L9 15" stroke="#5288C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="tg-back-count" id="tg-back-count"></span>
        </div>
        <div class="tg-header-center">
          <span class="tg-channel-name" id="post-channel-name"></span>
          <span class="tg-channel-sub" id="post-channel-sub"></span>
        </div>
        <img class="tg-avatar" id="post-avatar" src="" alt="" />
      </div>

      <!-- Тело: скроллируемая область -->
      <div class="tg-body">
        <div class="post-scroll" id="post-scroll">

          <!-- Закреплённое -->
          <div class="tg-pinned" id="pinned-box">
            <div class="tg-pinned-line"></div>
            <div class="tg-pinned-texts">
              <div class="tg-pinned-label">Закреплённое сообщение</div>
              <div class="tg-pinned-text" id="pinned-text"></div>
            </div>
          </div>

          <!-- Пузырёк сообщения -->
          <div class="tg-message">
            <!-- Фото -->
            <div class="tg-photos" id="photos"></div>

            <!-- Текст + ссылка -->
            <div class="tg-text-wrap" id="tg-text-wrap">
              <a class="tg-link" id="post-link" target="_blank" rel="noopener"></a>
              <div class="tg-text" id="post-text"></div>
            </div>

            <!-- Мета: время + просмотры -->
            <div class="tg-meta" id="views-row"></div>
          </div>

          <!-- Реакции -->
          <div class="tg-reactions" id="reactions"></div>

        </div>
      </div>

      <!-- Нижняя панель -->
      <div class="tg-footer">
        <div class="tg-footer-left">
          <div class="tg-avatar-row" id="comment-avatars">
            <span style="background:#E17076"></span>
            <span style="background:#7BC862"></span>
            <span style="background:#65AADD"></span>
          </div>
          <span class="tg-comment-label" id="comment-label">Прокомментировать</span>
        </div>
        <span class="tg-footer-chevron">›</span>
      </div>

    </div>

    <!-- ПРАВАЯ КАРТОЧКА: QR -->
    <div class="qr-side" id="qr-side-el">
      <div class="qr-glow-wrap">
        <div class="qr-glow"></div>
        <div class="qr-card">
          <div id="qr-target"></div>
        </div>
      </div>
      <div class="qr-username-pill">
        <div class="qr-username" id="qr-username"></div>
      </div>
    </div>

  </div>
</div>

<script src="/qr-code-styling.js"></script>
<script>
  const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
  const wrap       = document.getElementById('wrap');
  const phoneFrame = document.getElementById('phone-frame');
  const qrSideEl  = document.getElementById('qr-side-el');
  let hideTimer = null, swayTimer = null, scrollAnimId = null;

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'show_qr') showOverlay(msg.data, msg.displaySeconds || 12);
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();

  // Демо-режим: ?demo в URL показывает карточку с тестовыми данными
  if (new URLSearchParams(location.search).has('demo')) {
    setTimeout(() => showOverlay({
      channelUsername: 'nebudetgg',
      channelTitle: 'Руслан Кубик (радио за…',
      subscriberCount: '74 603 подписчика',
      postId: '6319',
      avatarDataUri: null,
      avatarUrl: null,
      photos: ['https://placehold.co/320x220/1a1a2e/ffffff?text=фото+поста'],
      text: 'Правительство Британии заявило, что 90% населения поддержало доступ в интернет по паспорту для защиты детей, но есть нюанс 🙂',
      views: '895',
      dateTime: new Date().toISOString(),
      reactions: [
        { emoji: '😊', count: 21 },
        { emoji: '❤️', count: 10 },
        { emoji: '😮', count: 6 },
        { emoji: '😢', count: 3 },
        { emoji: '🤔', count: 2 },
        { emoji: '👍', count: 2 },
      ],
      isFallback: false,
    }, 9999), 300);
  }

  function easeInOutQuad(t) {
    return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  }

  function startAutoScroll(el, { startDelayMs, scrollMs }) {
    if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
    const maxScroll = el.scrollHeight - el.clientHeight;
    if (maxScroll <= 4) return;
    const beginTime = performance.now() + startDelayMs;
    function tick(now) {
      if (now < beginTime) { scrollAnimId = requestAnimationFrame(tick); return; }
      const elapsed = now - beginTime;
      const progress = Math.min(elapsed / scrollMs, 1);
      el.scrollTop = easeInOutQuad(progress) * maxScroll;
      if (progress < 1) scrollAnimId = requestAnimationFrame(tick);
    }
    scrollAnimId = requestAnimationFrame(tick);
  }

  function circularizeImage(src) {
    return new Promise((resolve) => {
      if (!src) { resolve(null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const size = Math.min(img.naturalWidth, img.naturalHeight) || 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        const sx = (img.naturalWidth - size)/2;
        const sy = (img.naturalHeight - size)/2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, size, size);
        ctx.restore();
        try { resolve(canvas.toDataURL('image/png')); } catch { resolve(src); }
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  async function buildQr(link, avatarUrl) {
    const target = document.getElementById('qr-target');
    target.innerHTML = '';
    const circularAvatar = await circularizeImage(avatarUrl);
    const qr = new QRCodeStyling({
      width: 286, height: 286,
      type: 'svg',
      data: link,
      margin: 4,
      qrOptions: { errorCorrectionLevel: 'H' },
      dotsOptions: {
        type: 'rounded',
        gradient: {
          type: 'linear', rotation: 0.7,
          colorStops: [
            { offset: 0, color: '#5288C1' },
            { offset: 1, color: '#2979FF' },
          ],
        },
      },
      cornersSquareOptions: { type: 'dot', color: '#1A4F8A' },
      cornersDotOptions:   { type: 'dot', color: '#3D7FC4' },
      backgroundOptions:   { color: 'transparent' },
      image: circularAvatar || undefined,
      imageOptions: { crossOrigin: 'anonymous', margin: 6, imageSize: 0.38, hideBackgroundDots: true },
    });
    qr.append(target);
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }

  function showOverlay(data, displaySeconds) {
    if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
    document.getElementById('post-scroll').scrollTop = 0;

    const hasPost = Boolean(data.postId);

    // Аватар
    const avatarEl = document.getElementById('post-avatar');
    if (data.avatarDataUri || data.avatarUrl) {
      avatarEl.src = data.avatarDataUri || data.avatarUrl;
      avatarEl.style.display = '';
    } else {
      avatarEl.removeAttribute('src');
      avatarEl.style.display = 'none';
    }

    // Шапка
    document.getElementById('post-channel-name').textContent = data.channelTitle || data.channelUsername || '';
    document.getElementById('post-channel-sub').textContent  = data.subscriberCount || 'Telegram канал';
    // число постов — показываем id поста как приблизительный счётчик
    const backCount = document.getElementById('tg-back-count');
    backCount.textContent = data.postId ? data.postId : '';

    // Фото
    const photosEl = document.getElementById('photos');
    photosEl.innerHTML = '';
    const photoArr = (data.photos || []).slice(0, 2);
    if (photoArr.length === 1) {
      photosEl.className = 'tg-photos single';
      const img = document.createElement('img');
      img.src = photoArr[0];
      photosEl.appendChild(img);
    } else if (photoArr.length === 2) {
      photosEl.className = 'tg-photos multi';
      photoArr.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        photosEl.appendChild(img);
      });
    } else {
      photosEl.className = 'tg-photos';
    }

    // Ссылка
    const rawText = hasPost ? (data.text || '') : '';
    const urlMatch = rawText.match(/https?:\/\/\S+/);
    const linkEl = document.getElementById('post-link');
    if (urlMatch) {
      linkEl.href = urlMatch[0];
      linkEl.textContent = urlMatch[0];
      linkEl.classList.add('active');
    } else {
      linkEl.classList.remove('active');
      linkEl.removeAttribute('href');
    }

    // Текст
    const textWithoutLink = urlMatch ? rawText.replace(urlMatch[0], '').trim() : rawText;
    document.getElementById('post-text').textContent = hasPost
      ? textWithoutLink
      : (data.fallbackReason ? `Не нашёл последний пост: ${data.fallbackReason}` : '');

    // text-wrap: убираем если нет ни текста ни ссылки
    const textWrap = document.getElementById('tg-text-wrap');
    const hasTextContent = !!(urlMatch || textWithoutLink || !hasPost);
    textWrap.style.display = hasTextContent ? '' : 'none';

    // Мета (просмотры + время)
    const metaEl = document.getElementById('views-row');
    const parts = [];
    if (data.views) {
      parts.push(`<svg width="14" height="10" viewBox="0 0 14 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 1C3.5 1 1 5 1 5s2.5 4 6 4 6-4 6-4-2.5-4-6-4z" stroke="#8B8B8B" stroke-width="1.2" fill="none"/>
        <circle cx="7" cy="5" r="1.8" fill="#8B8B8B"/>
      </svg>${data.views}`);
    }
    if (data.dateTime) parts.push(formatDate(data.dateTime));
    metaEl.innerHTML = parts.join('<span style="margin:0 3px">·</span>');

    // Реакции
    const reactionsEl = document.getElementById('reactions');
    reactionsEl.innerHTML = '';
    (data.reactions || []).forEach(r => {
      const pill = document.createElement('div');
      pill.className = 'tg-reaction';
      pill.innerHTML = `<span class="em">${r.emoji}</span><span>${r.count}</span>`;
      reactionsEl.appendChild(pill);
    });

    // Нижняя панель
    document.getElementById('comment-label').textContent = hasPost ? 'Прокомментировать' : 'Открыть канал';
    document.getElementById('comment-avatars').style.display = hasPost ? '' : 'none';

    // QR
    document.getElementById('qr-username').textContent = '@' + data.channelUsername;
    buildQr(`https://t.me/${data.channelUsername}`, data.avatarDataUri || data.avatarUrl);

    // Показать
    if (hideTimer) clearTimeout(hideTimer);
    if (swayTimer) clearTimeout(swayTimer);
    phoneFrame.classList.remove('swaying');
    qrSideEl.classList.remove('swaying');
    wrap.classList.remove('leaving');
    requestAnimationFrame(() => wrap.classList.add('visible'));

    swayTimer = setTimeout(() => {
      phoneFrame.classList.add('swaying');
      qrSideEl.classList.add('swaying');
    }, 560);

    requestAnimationFrame(() => {
      const scrollEl = document.getElementById('post-scroll');
      const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
      const START_DELAY = 1300;
      const END_PAUSE   = 1900;
      const PX_PER_MS   = 1 / 22;
      let totalMs = displaySeconds * 1000;
      if (maxScroll > 4) {
        const scrollMs = Math.min(Math.max(maxScroll / PX_PER_MS, 2200), 9000);
        startAutoScroll(scrollEl, { startDelayMs: START_DELAY, scrollMs });
        totalMs = Math.max(totalMs, START_DELAY + scrollMs + END_PAUSE);
      }
      hideTimer = setTimeout(() => {
        phoneFrame.classList.remove('swaying');
        qrSideEl.classList.remove('swaying');
        wrap.classList.add('leaving');
        wrap.classList.remove('visible');
      }, totalMs);
    });
  }
</script>
</body>
</html>
