<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Twitch QR Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    /* iOS system font stack */
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 24px;
    padding-bottom: 0;
    pointer-events: none;
  }

  .wrap {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    opacity: 0;
    transition: opacity .5s cubic-bezier(.25,.8,.25,1);
  }
  .wrap.visible { opacity: 1; }
  .wrap.leaving { opacity: 0; transition-duration: .4s; }

  @keyframes swayL {
    0%,100% { transform: rotate(-0.45deg) translateY(0px); }
    50%     { transform: rotate( 0.45deg) translateY(-5px); }
  }
  @keyframes swayR {
    0%,100% { transform: rotate( 0.45deg) translateY(-3px); }
    50%     { transform: rotate(-0.45deg) translateY(2px); }
  }
  .phone-frame.swaying { animation: swayL 6.5s ease-in-out infinite; }
  .qr-side.swaying    { animation: swayR 7.2s ease-in-out infinite; }

  /* =============================================
     ТЕЛЕГРАМ-КАРТОЧКА (iOS-стиль)
     ============================================= */

  .phone-frame {
    /* Фиксированный размер — длинный пост не ломает макет */
    width: 300px;
    height: 615px;
    border-radius: 22px;
    overflow: hidden;
    /* Многослойная тень как у iOS-карточек */
    box-shadow:
      0 1px 1px rgba(0,0,0,.3),
      0 4px 12px rgba(0,0,0,.35),
      0 16px 40px rgba(0,0,0,.45),
      0 32px 64px rgba(0,0,0,.3);
    background: #1C1C1E;
    display: flex;
    flex-direction: column;

    /* Стартует за нижним краем экрана целиком, а не просто чуть ниже своего места */
    opacity: 0;
    transform: translateY(100vh);
    transition: opacity .55s cubic-bezier(.16,.8,.2,1) .04s,
                transform .55s cubic-bezier(.16,.8,.2,1) .04s;
  }
  .wrap.visible .phone-frame { opacity: 1; transform: translateY(0); }
  .wrap.leaving .phone-frame { transform: translateY(100vh); transition-duration: .4s; }

  /* ---------- ШАПКА — frosted glass ---------- */
  .tg-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px 10px 10px;
    background: rgba(28,28,30,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid rgba(255,255,255,.1);
  }

  .tg-back {
    display: flex;
    align-items: center;
    gap: 2px;
    color: #0A84FF;
    flex-shrink: 0;
  }
  .tg-back svg { width: 8px; height: 14px; }
  .tg-back-count {
    font-size: 15px;
    font-weight: 400;
    color: #0A84FF;
    letter-spacing: -0.2px;
  }

  .tg-header-center {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .tg-channel-name {
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
    letter-spacing: -0.2px;
  }
  .tg-channel-sub {
    font-size: 11px;
    color: rgba(255,255,255,.45);
    white-space: nowrap;
    letter-spacing: -0.1px;
  }

  .tg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #3A3A3C;
    display: block;
  }

  /* ---------- ТЕЛО ---------- */
  .tg-body {
    flex: 1;
    min-height: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image: radial-gradient(circle at 20% 80%, rgba(10,132,255,.04) 0%, transparent 60%),
                      radial-gradient(circle at 80% 20%, rgba(10,132,255,.03) 0%, transparent 50%);
  }

  .post-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0 4px;
    transition: opacity .25s ease;
  }
  .post-scroll.post-fading { opacity: 0; }

  /* Точки-индикатор текущего поста из последних N (показывается только если постов больше одного) */
  .tg-post-dots {
    display: none;
    justify-content: center;
    gap: 5px;
    padding: 7px 0 2px;
  }
  .tg-post-dots.active { display: flex; }
  .tg-post-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    transition: background .25s ease, transform .25s ease;
  }
  .tg-post-dots span.current {
    background: #0A84FF;
    transform: scale(1.3);
  }

  /* Когда пост — только фото без текста: растягиваем пузырёк на всю высоту */
  .post-scroll.photo-only {
    display: flex;
    flex-direction: column;
  }
  .post-scroll.photo-only .tg-message {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .post-scroll.photo-only .tg-photos {
    flex: 1;
  }
  .post-scroll.photo-only .tg-photos.single img {
    height: 100%;
    max-height: none;
    object-fit: contain;
  }
  .post-scroll::-webkit-scrollbar { width: 0; }

  /* Закреплённое */
  .tg-pinned {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.05);
    padding: 5px 12px;
    margin-bottom: 4px;
    border-bottom: 0.5px solid rgba(255,255,255,.06);
  }
  .tg-pinned.active { display: flex; }
  .tg-pinned-line {
    width: 2px; height: 28px;
    background: #0A84FF;
    border-radius: 2px;
    flex-shrink: 0;
  }
  /* Миниатюра закреплённого поста — показывается только если у поста есть фото */
  .tg-pinned-thumb {
    display: none;
    width: 32px; height: 32px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .tg-pinned-thumb.active { display: block; }
  .tg-pinned-texts { min-width: 0; flex: 1; }
  .tg-pinned-label {
    font-size: 12px; font-weight: 600;
    color: #0A84FF; margin-bottom: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tg-pinned-text {
    font-size: 12px; color: rgba(255,255,255,.45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Кнопка-пилюля справа (например «Участвовать (3)» для розыгрышей) */
  .tg-pinned-action {
    display: none;
    flex-shrink: 0;
    background: #0A84FF;
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: -0.1px;
  }
  .tg-pinned-action.active { display: block; }

  /* Пузырёк сообщения */
  .tg-message {
    margin: 0 8px 4px;
    background: #1C1C1E;
    border-radius: 18px;
    overflow: hidden;
    /* iOS-карточный shadow */
    box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
  }

  /* Фото */
  .tg-photos { display: flex; gap: 2px; }
  .tg-photos:empty { display: none; }
  .tg-photos.single img {
    width: 100%; height: auto;
    max-height: 260px;
    object-fit: cover;
    display: block;
  }
  .tg-photos.multi img {
    width: 50%; aspect-ratio: 1;
    object-fit: cover; display: block;
  }

  /* Текст */
  .tg-text-wrap { padding: 10px 12px 6px; }
  .tg-link {
    display: none;
    font-size: 13px; color: #0A84FF;
    text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 5px;
    font-weight: 400;
  }
  .tg-link.active { display: block; }

  .tg-text {
    font-size: 13px;
    line-height: 1.48;
    color: rgba(255,255,255,.92);
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: -0.1px;
  }
  .tg-text:empty { display: none; }

  /* Мета — просмотры и время */
  .tg-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    padding: 2px 12px 8px;
    color: rgba(255,255,255,.35);
    font-size: 11px;
    letter-spacing: -0.1px;
  }
  .tg-meta:empty { display: none; padding: 0; }

  /* ---------- РЕАКЦИИ ---------- */
  .tg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 8px 6px;
  }
  .tg-reactions:empty { display: none; }

  .tg-reaction {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(10,132,255,.14);
    border: 0.5px solid rgba(10,132,255,.3);
    border-radius: 999px;
    padding: 3px 9px 3px 6px;
    font-size: 12px;
    color: rgba(255,255,255,.85);
    font-weight: 500;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tg-reaction .em { font-size: 13px; line-height: 1; }

  /* ---------- НИЖНЯЯ ПАНЕЛЬ — frosted ---------- */
  .tg-footer {
    flex-shrink: 0;
    background: rgba(28,28,30,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 0.5px solid rgba(255,255,255,.1);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tg-footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tg-avatar-row { display: flex; }
  .tg-avatar-row span {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #1C1C1E;
    margin-left: -6px; display: block;
  }
  .tg-avatar-row span:first-child { margin-left: 0; }

  /* Иконка комментариев — как в настоящем Telegram, когда список
     комментаторов ещё пуст/неизвестен (речевой пузырь) */
  .tg-comment-icon {
    width: 20px; height: 20px;
    flex-shrink: 0;
    color: #0A84FF;
  }

  .tg-comment-label {
    font-size: 13px;
    font-weight: 500;
    color: #0A84FF;
    letter-spacing: -0.1px;
  }
  .tg-footer-chevron {
    color: rgba(255,255,255,.25);
    font-size: 18px;
    font-weight: 300;
  }

  /* =============================================
     QR-КАРТОЧКА (iOS-стиль)
     ============================================= */

  .qr-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(100vh) scale(.93);
    transition: opacity .5s ease .1s,
                transform .5s cubic-bezier(.2,.85,.25,1.1) .1s;
  }
  .wrap.visible .qr-side { opacity: 1; transform: translateY(0) scale(1); }
  .wrap.leaving .qr-side { transform: translateY(100vh) scale(.93); transition: opacity .4s ease, transform .4s ease; }

  .qr-glow-wrap {
    position: relative;
    /* Враппер крупнее карточки — шарики выходят за её края */
    width: 370px; height: 370px;
    display: flex; align-items: center; justify-content: center;
    overflow: visible;
  }
  /* Подсветка из-за спины карточки */
  .qr-backlight {
    position: absolute;
    width: 286px; height: 286px;
    border-radius: 30px;
    background: #0A84FF;
    z-index: 0;
    filter: blur(18px);
    transform: scale(1.04);
    animation: backlightPulse 3s ease-in-out infinite;
  }
  @keyframes backlightPulse {
    0%,100% { opacity: .75; filter: blur(18px); transform: scale(1.04); }
    50%      { opacity: 1;   filter: blur(22px); transform: scale(1.07); }
  }

  .qr-card {
    position: relative;
    z-index: 1;
    width: 286px; height: 286px;
    background: #FFFFFF;
    border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    box-shadow:
      0 4px 20px rgba(0,0,0,.35),
      0 16px 40px rgba(0,0,0,.25);
  }
  #qr-target {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #qr-target svg {
    display: block;
    width: 100% !important; height: 100% !important;
  }

  /* Username — iOS-стиль: frosted pill */
  .qr-username-pill {
    padding: 10px 28px;
    border-radius: 999px;
    background: rgba(255,255,255,.13);
    border: 0.5px solid rgba(255,255,255,.2);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 4px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .qr-username {
    font-size: 20px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="wrap" id="wrap">

    <!-- ЛЕВАЯ КАРТОЧКА -->
    <div class="phone-frame" id="phone-frame">

      <div class="tg-topbar">
        <div class="tg-back">
          <svg viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 1L1 7L7 13" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="tg-back-count" id="tg-back-count"></span>
        </div>
        <div class="tg-header-center">
          <span class="tg-channel-name" id="post-channel-name"></span>
          <span class="tg-channel-sub" id="post-channel-sub"></span>
        </div>
        <img class="tg-avatar" id="post-avatar" src="" alt="" />
      </div>

      <div class="tg-body">
        <div class="post-scroll" id="post-scroll">

          <div class="tg-pinned" id="pinned-box">
            <div class="tg-pinned-line" id="pinned-line"></div>
            <img class="tg-pinned-thumb" id="pinned-thumb" src="" alt="" />
            <div class="tg-pinned-texts">
              <div class="tg-pinned-label">Закреплённое сообщение</div>
              <div class="tg-pinned-text" id="pinned-text"></div>
            </div>
            <div class="tg-pinned-action" id="pinned-action"></div>
          </div>

          <div class="tg-message">
            <div class="tg-photos" id="photos"></div>
            <div class="tg-text-wrap" id="tg-text-wrap">
              <a class="tg-link" id="post-link" target="_blank" rel="noopener"></a>
              <div class="tg-text" id="post-text"></div>
            </div>
            <div class="tg-meta" id="views-row"></div>
          </div>

          <div class="tg-reactions" id="reactions"></div>

        </div>
      </div>

      <div class="tg-post-dots" id="post-dots"></div>

      <div class="tg-footer">
        <div class="tg-footer-left">
          <div class="tg-avatar-row" id="comment-avatars" style="display:none">
            <span style="background:#FF453A"></span>
            <span style="background:#30D158"></span>
            <span style="background:#0A84FF"></span>
          </div>
          <svg class="tg-comment-icon" id="comment-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3C7.03 3 3 6.58 3 11c0 2.49 1.28 4.71 3.3 6.19-.1.99-.5 2.44-1.55 3.9 1.95-.24 3.5-1.02 4.6-1.77.85.24 1.75.37 2.65.37 4.97 0 9-3.58 9-8s-4.03-8-9-8z" fill="currentColor"/>
          </svg>
          <span class="tg-comment-label" id="comment-label">Прокомментировать</span>
        </div>
        <span class="tg-footer-chevron">›</span>
      </div>

    </div>

    <!-- ПРАВАЯ КАРТОЧКА: QR -->
    <div class="qr-side" id="qr-side-el">
      <div class="qr-glow-wrap">
        <!-- подсветка из-за спины карточки -->
        <div class="qr-backlight"></div>
        <div class="qr-card">
          <div id="qr-target"></div>
        </div>
      </div>
      <div class="qr-username-pill">
        <div class="qr-username" id="qr-username"></div>
      </div>
    </div>

  </div>
</div>

<script src="/qr-code-styling.js"></script>
<script>
  const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
  const wrap       = document.getElementById('wrap');
  const phoneFrame = document.getElementById('phone-frame');
  const qrSideEl   = document.getElementById('qr-side-el');
  let hideTimer = null, swayTimer = null, scrollAnimId = null;
  let rotateTimer = null, rotateFadeTimer = null;
  let currentPosts = [], currentPostIndex = 0;
  const ROTATE_MS = 6000; // как часто меняется пост при показе «последних постов»

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'show_qr') showOverlay(msg.data, msg.displaySeconds ?? null);
        if (msg.type === 'hide_qr')  hideOverlay();
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();

  // ?demo — предпросмотр без команды
  // ?demo=multi — предпросмотр цикла из нескольких последних постов
  const demoParam = new URLSearchParams(location.search).get('demo');
  if (demoParam !== null) {
    const baseChannel = {
      channelUsername: 'nebudetgg',
      channelTitle: 'Руслан Кубик',
      subscriberCount: '74 603 подписчика',
      avatarDataUri: null, avatarUrl: null,
      isFallback: false,
    };
    const demoPostsMulti = [
      {
        postId: '6319',
        pinned: {
          text: '🎁 ЛЕГЕНДАРНЫЙ розыгрыш от нас!',
          thumbUrl: 'https://placehold.co/64x64/2c2c2e/ffffff?text=%F0%9F%8E%81',
          actionLabel: 'Участвовать (3)',
        },
        photos: ['https://placehold.co/300x180/1c1c1e/ffffff?text=фото+поста'],
        text: 'Правительство Британии заявило, что 90% населения поддержало доступ в интернет по паспорту для защиты детей, но есть нюанс 🙂',
        views: '895',
        dateTime: new Date().toISOString(),
        reactions: [
          { emoji: '😊', count: 21 }, { emoji: '❤️', count: 10 },
          { emoji: '😮', count: 6  }, { emoji: '😢', count: 3  },
          { emoji: '🤔', count: 2  }, { emoji: '👍', count: 2  },
        ],
      },
      {
        postId: '6318',
        photos: [],
        text: 'Через 10 минут начинаем стрим, не проспите ⏰',
        views: '612',
        dateTime: new Date(Date.now() - 3600e3).toISOString(),
        reactions: [{ emoji: '🔥', count: 14 }, { emoji: '❤️', count: 5 }],
      },
      {
        postId: '6317',
        photos: ['https://placehold.co/300x180/1c1c1e/ffffff?text=клип+дня'],
        text: 'Клип дня — досмотрите до конца 😂',
        views: '2 130',
        dateTime: new Date(Date.now() - 7200e3).toISOString(),
        reactions: [{ emoji: '😂', count: 40 }, { emoji: '👍', count: 12 }],
      },
    ];
    setTimeout(() => showOverlay({
      ...baseChannel,
      posts: demoParam === 'multi' ? demoPostsMulti : [demoPostsMulti[0]],
    }, 9999), 300);
  }

  function easeInOutQuad(t) {
    return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  }

  function startAutoScroll(el, { startDelayMs, scrollMs }) {
    if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
    const maxScroll = el.scrollHeight - el.clientHeight;
    if (maxScroll <= 4) return;
    const beginTime = performance.now() + startDelayMs;
    function tick(now) {
      if (now < beginTime) { scrollAnimId = requestAnimationFrame(tick); return; }
      const elapsed = now - beginTime;
      const progress = Math.min(elapsed / scrollMs, 1);
      el.scrollTop = easeInOutQuad(progress) * maxScroll;
      if (progress < 1) scrollAnimId = requestAnimationFrame(tick);
    }
    scrollAnimId = requestAnimationFrame(tick);
  }

  function circularizeImage(src) {
    return new Promise((resolve) => {
      if (!src) { resolve(null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const size = Math.min(img.naturalWidth, img.naturalHeight) || 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
        ctx.closePath(); ctx.clip();
        const sx = (img.naturalWidth - size)/2;
        const sy = (img.naturalHeight - size)/2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, size, size);
        ctx.restore();
        try { resolve(canvas.toDataURL('image/png')); } catch { resolve(src); }
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    return [h, s, l];
  }

  function hslToHex(h, s, l) {
    const a = s * Math.min(l, 1 - l);
    const f = n => {
      const k = (n + h * 12) % 12;
      const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      return Math.round(255 * v).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }

  /**
   * Сэмплирует пиксели аватарки, находит доминирующий оттенок (hue)
   * и возвращает из него яркий насыщенный цвет — независимо от
   * того, насколько тёмная или светлая исходная картинка.
   */
  function extractAvatarColors(canvas) {
    const ctx = canvas.getContext('2d');
    const s = canvas.width;
    // Накапливаем взвешенные hue-голоса (вес = насыщенность пикселя)
    const hueBuckets = new Array(36).fill(0); // 36 секторов по 10°
    const step = Math.max(1, Math.floor(s / 10));
    for (let y = 0; y < s; y += step) {
      for (let x = 0; x < s; x += step) {
        const dx = x - s/2, dy = y - s/2;
        if (dx*dx + dy*dy > (s/2)*(s/2)) continue;
        const [r, g, b] = ctx.getImageData(x, y, 1, 1).data;
        // пропускаем почти-чёрные, почти-белые и почти-серые пиксели
        const [h, sat, lit] = rgbToHsl(r, g, b);
        if (sat < 0.15 || lit < 0.08 || lit > 0.92) continue;
        hueBuckets[Math.floor(h * 36)] += sat; // насыщенный пиксель весит больше
      }
    }
    // Лучший сектор — тот, у которого больше всего насыщенных пикселей
    const bestIdx = hueBuckets.indexOf(Math.max(...hueBuckets));
    if (hueBuckets[bestIdx] === 0) return { main: '#0A84FF', dark: '#003D99' };

    const hue = bestIdx / 36; // 0..1
    // main: яркий насыщенный цвет нужного оттенка
    // dark: тот же оттенок, но темнее — для градиента и углов QR
    return {
      main: hslToHex(hue, 0.9, 0.52),
      dark: hslToHex(hue, 0.95, 0.28),
    };
  }

  let _qrGen = 0; // счётчик поколений — защита от гонки рендера

  async function buildQr(link, avatarUrl) {
    const gen = ++_qrGen; // захватываем текущее поколение
    const target = document.getElementById('qr-target');
    target.innerHTML = '';
    const circularAvatar = await circularizeImage(avatarUrl);
    if (gen !== _qrGen) return; // пришёл новый запрос пока мы грузили — выходим

    // Извлекаем цвет из аватарки если она есть
    let mainColor = '#0A84FF', darkColor = '#003D99';
    if (circularAvatar) {
      // circularizeImage уже нарисовала на canvas — рисуем снова для сэмплирования
      const tmpImg = new Image();
      await new Promise(res => { tmpImg.onload = res; tmpImg.onerror = res; tmpImg.src = circularAvatar; });
      const tmpCanvas = document.createElement('canvas');
      const sz = 64;
      tmpCanvas.width = tmpCanvas.height = sz;
      tmpCanvas.getContext('2d').drawImage(tmpImg, 0, 0, sz, sz);
      const colors = extractAvatarColors(tmpCanvas);
      mainColor = colors.main;
      darkColor = colors.dark;
    }

    // Перекрашиваем подсветку под цвет аватарки
    const backlight = document.querySelector('.qr-backlight');
    if (backlight) backlight.style.background = mainColor;

    new QRCodeStyling({
      width: 258, height: 258,
      type: 'svg', data: link, margin: 4,
      qrOptions: { errorCorrectionLevel: 'H' },
      dotsOptions: {
        type: 'rounded',
        gradient: {
          type: 'linear', rotation: 0.8,
          colorStops: [
            { offset: 0, color: mainColor },
            { offset: 1, color: darkColor },
          ],
        },
      },
      cornersSquareOptions: { type: 'dot', color: darkColor },
      cornersDotOptions:   { type: 'dot', color: mainColor },
      backgroundOptions:   { color: 'transparent' },
      image: circularAvatar || undefined,
      imageOptions: { crossOrigin: 'anonymous', margin: 6, imageSize: 0.36, hideBackgroundDots: true },
    }).append(target);
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '' : d.toLocaleString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }

  function showOverlay(data, displaySeconds) {
    if (rotateTimer) { clearTimeout(rotateTimer); rotateTimer = null; }
    if (rotateFadeTimer) { clearTimeout(rotateFadeTimer); rotateFadeTimer = null; }

    // Шапка канала — общая для всех постов, выставляется один раз
    const avatarEl = document.getElementById('post-avatar');
    if (data.avatarDataUri || data.avatarUrl) {
      avatarEl.src = data.avatarDataUri || data.avatarUrl;
      avatarEl.style.display = '';
    } else {
      avatarEl.removeAttribute('src');
      avatarEl.style.display = 'none';
    }
    document.getElementById('post-channel-name').textContent = data.channelTitle || data.channelUsername || '';
    document.getElementById('post-channel-sub').textContent  = data.subscriberCount || 'Telegram канал';

    // QR — тоже общий для канала, не зависит от того, какой пост сейчас на экране
    document.getElementById('qr-username').textContent = '@' + data.channelUsername;
    buildQr(`https://t.me/${data.channelUsername}`, data.avatarDataUri || data.avatarUrl);

    // Список постов для показа: несколько последних (цикл) либо один конкретный.
    // Поддерживаем и старый формат (данные поста прямо в data), и новый data.posts[].
    currentPosts = Array.isArray(data.posts) && data.posts.length > 0
      ? data.posts
      : [{ postId: data.postId, photos: data.photos, text: data.text, views: data.views,
           dateTime: data.dateTime, reactions: data.reactions, pinned: data.pinned,
           fallbackReason: data.fallbackReason }];
    currentPostIndex = 0;

    // Точки-индикатор показываем только когда постов реально несколько
    const dotsEl = document.getElementById('post-dots');
    dotsEl.classList.toggle('active', currentPosts.length > 1);

    renderPost(currentPosts[0], { immediate: true });

    // Показать
    if (hideTimer) clearTimeout(hideTimer);
    if (swayTimer) clearTimeout(swayTimer);
    phoneFrame.classList.remove('swaying');
    qrSideEl.classList.remove('swaying');
    wrap.classList.remove('leaving');
    requestAnimationFrame(() => wrap.classList.add('visible'));

    swayTimer = setTimeout(() => {
      phoneFrame.classList.add('swaying');
      qrSideEl.classList.add('swaying');
    }, 560);

    // Если постов несколько — переключаем их по кругу, пока карточка на экране
    if (currentPosts.length > 1) {
      scheduleNextRotation();
    }

    // displaySeconds === null → показываем бесконечно (до !qr off)
    if (displaySeconds !== null && displaySeconds > 0) {
      hideTimer = setTimeout(hideOverlay, displaySeconds * 1000);
    }
  }

  function scheduleNextRotation() {
    if (rotateTimer) clearTimeout(rotateTimer);
    rotateTimer = setTimeout(() => {
      currentPostIndex = (currentPostIndex + 1) % currentPosts.length;
      const scrollEl = document.getElementById('post-scroll');
      scrollEl.classList.add('post-fading');
      rotateFadeTimer = setTimeout(() => {
        renderPost(currentPosts[currentPostIndex], { immediate: false });
        scrollEl.classList.remove('post-fading');
        scheduleNextRotation();
      }, 260);
    }, ROTATE_MS);
  }

  // Отрисовывает ОДИН пост в теле карточки (вызывается и при первом показе, и при ротации)
  function renderPost(data, { immediate }) {
    if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
    const hasPost = Boolean(data.postId);

    document.getElementById('tg-back-count').textContent = data.postId || '';

    // Точки-индикатор: подсвечиваем текущий
    const dotsEl = document.getElementById('post-dots');
    dotsEl.innerHTML = currentPosts.map((_, i) =>
      `<span class="${i === currentPostIndex ? 'current' : ''}"></span>`).join('');

    // Фото
    const photosEl = document.getElementById('photos');
    photosEl.innerHTML = '';
    const photoArr = (data.photos || []).slice(0, 2);
    if (photoArr.length === 1) {
      photosEl.className = 'tg-photos single';
      const img = document.createElement('img'); img.src = photoArr[0];
      photosEl.appendChild(img);
    } else if (photoArr.length === 2) {
      photosEl.className = 'tg-photos multi';
      photoArr.forEach(src => {
        const img = document.createElement('img'); img.src = src;
        photosEl.appendChild(img);
      });
    } else {
      photosEl.className = 'tg-photos';
    }

    // Ссылка + текст
    const rawText = hasPost ? (data.text || '') : '';
    const urlMatch = rawText.match(/https?:\/\/\S+/);
    const linkEl = document.getElementById('post-link');
    if (urlMatch) {
      linkEl.href = urlMatch[0]; linkEl.textContent = urlMatch[0];
      linkEl.classList.add('active');
    } else {
      linkEl.classList.remove('active'); linkEl.removeAttribute('href');
    }
    const textWithoutLink = urlMatch ? rawText.replace(urlMatch[0], '').trim() : rawText;
    document.getElementById('post-text').textContent = hasPost
      ? textWithoutLink
      : (data.fallbackReason ? `Не нашёл последний пост: ${data.fallbackReason}` : '');

    const textWrap = document.getElementById('tg-text-wrap');
    textWrap.style.display = (urlMatch || textWithoutLink || !hasPost) ? '' : 'none';

    // Режим «только фото» — центрируем картинку вертикально.
    // Применяем только когда: ровно 1 фото, нет текста/ссылки, нет реакций.
    const scrollEl2 = document.getElementById('post-scroll');
    const hasReactions = data.reactions && data.reactions.length > 0;
    const isPhotoOnly = photoArr.length === 1 && !urlMatch && !textWithoutLink && hasPost && !hasReactions;
    scrollEl2.classList.toggle('photo-only', isPhotoOnly);

    // Мета
    const metaEl = document.getElementById('views-row');
    const parts = [];
    if (data.views) parts.push(
      `<svg width="13" height="9" viewBox="0 0 13 9" fill="none">
        <path d="M6.5 1C3.5 1 1 4.5 1 4.5s2.5 3.5 5.5 3.5 5.5-3.5 5.5-3.5S9.5 1 6.5 1z"
          stroke="rgba(255,255,255,.35)" stroke-width="1.2" fill="none"/>
        <circle cx="6.5" cy="4.5" r="1.6" fill="rgba(255,255,255,.35)"/>
      </svg>${data.views}`
    );
    if (data.dateTime) parts.push(formatDate(data.dateTime));
    metaEl.innerHTML = parts.join('<span style="margin:0 3px;opacity:.35">·</span>');

    // Реакции
    const reactionsEl = document.getElementById('reactions');
    reactionsEl.innerHTML = '';
    (data.reactions || []).forEach(r => {
      const pill = document.createElement('div');
      pill.className = 'tg-reaction';
      pill.innerHTML = `<span class="em">${r.emoji}</span><span>${r.count}</span>`;
      reactionsEl.appendChild(pill);
    });

    // Закреплённое сообщение (если данные переданы отдельным полем pinned)
    const pinnedBox = document.getElementById('pinned-box');
    const pinned = data.pinned || null;
    if (pinned && (pinned.text || pinned.thumbUrl)) {
      pinnedBox.classList.add('active');
      document.getElementById('pinned-text').textContent = pinned.text || '';
      const thumbEl = document.getElementById('pinned-thumb');
      const lineEl = document.getElementById('pinned-line');
      if (pinned.thumbUrl) {
        thumbEl.src = pinned.thumbUrl;
        thumbEl.classList.add('active');
        lineEl.style.display = 'none';
      } else {
        thumbEl.classList.remove('active');
        lineEl.style.display = '';
      }
      const actionEl = document.getElementById('pinned-action');
      if (pinned.actionLabel) {
        actionEl.textContent = pinned.actionLabel;
        actionEl.classList.add('active');
      } else {
        actionEl.classList.remove('active');
      }
    } else {
      pinnedBox.classList.remove('active');
    }

    // Нижняя панель
    document.getElementById('comment-label').textContent = hasPost ? 'Прокомментировать' : 'Открыть канал';
    // Показываем кружки-аватарки только если реально передан список комментаторов,
    // иначе (как в настоящем Telegram при отсутствии данных) — иконка речевого пузыря
    const hasCommentAvatars = Array.isArray(data.commentAvatars) && data.commentAvatars.length > 0;
    document.getElementById('comment-avatars').style.display = hasCommentAvatars ? 'flex' : 'none';
    document.getElementById('comment-icon').style.display = hasCommentAvatars ? 'none' : (hasPost ? '' : 'none');

    const scrollEl = document.getElementById('post-scroll');
    scrollEl.scrollTop = 0;

    requestAnimationFrame(() => {
      const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
      const START_DELAY = immediate ? 1300 : 300;
      const PX_PER_MS   = 1 / 22;

      if (maxScroll > 4) {
        const scrollMs = Math.min(Math.max(maxScroll / PX_PER_MS, 2200), 9000);
        startAutoScroll(scrollEl, { startDelayMs: START_DELAY, scrollMs });
      }
    });
  }

  function hideOverlay() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (swayTimer) { clearTimeout(swayTimer); swayTimer = null; }
    if (rotateTimer) { clearTimeout(rotateTimer); rotateTimer = null; }
    if (rotateFadeTimer) { clearTimeout(rotateFadeTimer); rotateFadeTimer = null; }
    if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
    phoneFrame.classList.remove('swaying');
    qrSideEl.classList.remove('swaying');
    wrap.classList.add('leaving');
    wrap.classList.remove('visible');
  }
</script>
